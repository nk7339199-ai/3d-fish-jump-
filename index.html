<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐟</text></svg>">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}
body {
  background-color: #2ed573;
  overflow: hidden;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  transition: background-color 1.5s ease;
}
#canvas-container {
  width: 100vw;
  height: 100vh;
}
#start-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #000;
  background-image: url('https://files.catbox.moe/uczd75.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 100;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
}
#ui {
  position: absolute;
  top: 20px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  z-index: 5;
}
.score {
  font-size: 48px;

  color: #ffffff;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
}

  font-size: 26px;

  text-shadow: 1px 1px 6px rgba(0,0,0,0.8);
  letter-spacing: 6px;
}
#music-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 45px;
  height: 45px;
  background: rgba(0, 0, 0, 0.6);
  border: 2px solid #ffffff;
  border-radius: 50%;
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20;
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
#music-btn:active {
  transform: scale(0.9);
}
#power-meter {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 16px;
  background: rgba(0,0,0,0.5);
  border: 2px solid #fff;
  border-radius: 10px;
  overflow: hidden;
  display: none;
  z-index: 5;
}
#power-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #00d2ff, #fbc531, #e84118);
}
#game-over {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  z-index: 120;
}
#game-over h1 { font-size: 42px; color: #ff5252; margin-bottom: 20px; }
#restart-btn {
  padding: 14px 36px;
  font-size: 20px;
  font-weight: bold;
  background: #e84118;
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(232, 65, 24, 0.5);
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="start-screen"></div>
<div id="canvas-container"></div>
<button id="music-btn" title="Music">🔊</button>
<div id="ui">
  <div class="score" id="score">0</div>
  <div class="lives" id="lives">🐟 🐟 🐟</div>
</div>
<div id="power-meter"><div id="power-fill"></div></div>
<div id="game-over">
  <h1>GAME OVER</h1>
  <button id="restart-btn" type="button">Try Again</button>
</div>

<script>
const splashAudio = new Audio('https://files.catbox.moe/eizhrs.mp3');
splashAudio.preload = 'auto';

const bgMusic = new Audio('https://files.catbox.moe/r1txg9.mp3');
bgMusic.loop = true;
bgMusic.volume = 1.0;
bgMusic.preload = 'auto';

let isMusicMuted = false;
let gameStarted = false;

function playWaterLandSound() {
  splashAudio.currentTime = 0;
  splashAudio.play().catch(() => {});
}

function initStartScreen() {
  const startScreen = document.getElementById('start-screen');
  const startGame = () => {
    if (!gameStarted) {
      gameStarted = true;
      startScreen.style.display = 'none';
      if (!isMusicMuted && bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
    }
  };
  startScreen.addEventListener('click', startGame);
  startScreen.addEventListener('touchstart', startGame);
}

function initMusicControls() {
  const musicBtn = document.getElementById('music-btn');
  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isMusicMuted) {
      bgMusic.play().catch(() => {});
      musicBtn.innerText = '🔊';
      isMusicMuted = false;
    } else {
      bgMusic.pause();
      musicBtn.innerText = '🔇';
      isMusicMuted = true;
    }
  });
}

let scene, camera, renderer;
let ambientLight, dirLight;
let playerFish;
let activeWells = [];
let bubbles = [];
let splashParticles = [];
let gameState = 'READY';
let chargePower = 0;
const maxPower = 100;
let score = 0;
let lives = 3;
let animClock = 0;
let fishPos = new THREE.Vector3();
let fishVel = new THREE.Vector3();

const GRAVITY_SEC = 34.2;

let swimAngle = 0;

const WELL_DIAMETER = 4.0;
const WATER_Y = 0.032;
const INNER_WATER_RADIUS = 0.82;
const WATER_OFFSET_Z = -0.07;

let rainSystem, rainGeo, rainCount = 1000;
let currentWeatherIndex = -1;

const loader = new THREE.TextureLoader();
loader.setCrossOrigin('');
const wellTexture = loader.load('https://files.catbox.moe/tygfbr.png');

const wellMaterial = new THREE.MeshBasicMaterial({
  map: wellTexture,
  transparent: true,
  alphaTest: 0.05,
  side: THREE.DoubleSide
});

function buildFinMesh(shape, depth, mat) {
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth,
    bevelEnabled: true,
    bevelThickness: 0.02,
    bevelSize: 0.02,
    bevelSegments: 2
  });
  return new THREE.Mesh(geo, mat);
}

function createRealisticFish(primaryColor = 0xff5400, finColor = 0xffb703, scale = 0.22) {
  const fishRoot = new THREE.Group();
  const fish = new THREE.Group();
  fish.rotation.y = -Math.PI / 2;
  fishRoot.add(fish);

  const fishBodyMat = new THREE.MeshPhysicalMaterial({
    color: primaryColor,
    roughness: 0.25,
    metalness: 0.05,
    clearcoat: 0.8,
    clearcoatRoughness: 0.1
  });

  const finMat = new THREE.MeshPhysicalMaterial({
    color: finColor,
    roughness: 0.2,
    transmission: 0.3,
    opacity: 0.9,
    transparent: true,
    thickness: 0.15,
    side: THREE.DoubleSide
  });

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  const eyePupilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });

  const headGeo = new THREE.SphereGeometry(0.72, 14, 12);
  headGeo.scale(1.2, 0.92, 0.78);
  const headMesh = new THREE.Mesh(headGeo, fishBodyMat);
  fish.add(headMesh);

  [-0.5, 0.5].forEach((zSide) => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), eyeWhiteMat);
    eye.position.set(0.42, 0.18, zSide * 0.68);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), eyePupilMat);
    pupil.position.set(0.51, 0.18, zSide * 0.74);
    fish.add(eye, pupil);
  });

  const segments = [];
  let currentParent = fish;
  const spineConfig = [
    { r: 0.68, x: -0.55 },
    { r: 0.54, x: -0.60 },
    { r: 0.38, x: -0.52 },
    { r: 0.20, x: -0.42 }
  ];

  spineConfig.forEach((cfg) => {
    const bone = new THREE.Group();
    bone.position.x = cfg.x;
    currentParent.add(bone);
    segments.push(bone);

    const partGeo = new THREE.SphereGeometry(cfg.r, 12, 10);
    partGeo.scale(1.22, 0.9, 0.68);
    const partMesh = new THREE.Mesh(partGeo, fishBodyMat);
    partMesh.position.x = -cfg.r * 0.45;
    bone.add(partMesh);

    currentParent = bone;
  });

  const pecShape = new THREE.Shape();
  pecShape.moveTo(0, 0);
  pecShape.quadraticCurveTo(0.3, 0.4, 0.9, 0.55);
  pecShape.quadraticCurveTo(0.7, 0.1, 0.8, -0.2);
  pecShape.quadraticCurveTo(0.3, -0.15, 0, 0);

  const leftPecPivot = new THREE.Group();
  leftPecPivot.position.set(0.1, -0.22, 0.54);
  leftPecPivot.rotation.set(0.3, -0.4, -0.3);
  fish.add(leftPecPivot);
  const leftPecMesh = buildFinMesh(pecShape, 0.02, finMat);
  leftPecPivot.add(leftPecMesh);

  const rightPecPivot = new THREE.Group();
  rightPecPivot.position.set(0.1, -0.22, -0.54);
  rightPecPivot.rotation.set(-0.3, 0.4, -0.3);
  fish.add(rightPecPivot);
  const rightPecMesh = buildFinMesh(pecShape, 0.02, finMat);
  rightPecMesh.scale.set(1, 1, -1);
  rightPecPivot.add(rightPecMesh);

  const dorsalShape = new THREE.Shape();
  dorsalShape.moveTo(0, 0);
  dorsalShape.quadraticCurveTo(-0.3, 0.7, -0.9, 0.65);
  dorsalShape.quadraticCurveTo(-0.7, 0.2, -0.85, 0);
  dorsalShape.closePath();
  const dorsalMesh = buildFinMesh(dorsalShape, 0.025, finMat);
  dorsalMesh.position.set(-0.15, 0.55, -0.012);
  segments[0].add(dorsalMesh);

  const tailShape = new THREE.Shape();
  tailShape.moveTo(0, 0.04);
  tailShape.quadraticCurveTo(-0.5, 0.85, -1.35, 0.95);
  tailShape.bezierCurveTo(-1.0, 0.25, -1.0, -0.25, -1.35, -0.95);
  tailShape.quadraticCurveTo(-0.5, -0.85, 0, -0.04);
  tailShape.closePath();
  const tailMesh = buildFinMesh(tailShape, 0.03, finMat);
  tailMesh.position.set(-0.28, 0, -0.015);
  currentParent.add(tailMesh);

  fishRoot.scale.set(scale, scale, scale);

  return {
    root: fishRoot,
    innerFish: fish,
    segments: segments,
    tailMesh: tailMesh,
    leftPecPivot: leftPecPivot,
    rightPecPivot: rightPecPivot,
    baseScale: scale
  };
}

function createRippleTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  return { canvas, ctx, texture };
}

function init() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2ed573);
  scene.fog = new THREE.FogExp2(0x2ed573, 0.015);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 800);
  camera.position.set(0, 11.5, -7.5);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  container.appendChild(renderer.domElement);

  ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
  scene.add(ambientLight);

  dirLight = new THREE.DirectionalLight(0xfff3bf, 1.1);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  const groundGeo = new THREE.PlaneGeometry(350, 350);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x2ed573, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  scene.add(ground);

  createGrassBlades();
  createRainSystem();

  playerFish = createRealisticFish(0xff5400, 0xffb703, 0.22);
  scene.add(playerFish.root);

  initGameWells();
  initStartScreen();
  initMusicControls();

  window.addEventListener('resize', onWindowResize);

  const handleSurfaceDown = (e) => {
    if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn')) return;
    if (gameState === 'READY') startCharge();
  };

  const handleSurfaceUp = (e) => {
    if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn')) return;
    if (gameState === 'CHARGING') releaseJump();
  };

  window.addEventListener('mousedown', handleSurfaceDown);
  window.addEventListener('mouseup', handleSurfaceUp);
  window.addEventListener('touchstart', (e) => {
    if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn')) return;
    if (gameState === 'READY') { e.preventDefault(); startCharge(); }
  }, { passive: false });
  window.addEventListener('touchend', (e) => {
    if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn')) return;
    if (gameState === 'CHARGING') releaseJump();
  });

  document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    resetGame();
  });

  resetGame();
  animate();
}

function createGrassBlades() {
  const bladeGeo = new THREE.ConeGeometry(0.1, 0.45, 4);
  const bladeMat = new THREE.MeshStandardMaterial({ color: 0x20bf6b, roughness: 0.6 });
  for (let i = 0; i < 160; i++) {
    const blade = new THREE.Mesh(bladeGeo, bladeMat);
    const x = (Math.random() - 0.5) * 100;
    const z = (Math.random() - 0.5) * 100;
    if (Math.abs(x) < 3 && Math.abs(z) < 3) continue;
    blade.position.set(x, 0.2, z);
    blade.rotation.z = (Math.random() - 0.5) * 0.3;
    scene.add(blade);
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function disposeWellEntity(well) {
  scene.remove(well.group);
  well.group.traverse((obj) => {
    if (obj.isMesh) {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) {
          obj.material.forEach(m => m.dispose());
        } else {
          obj.material.dispose();
        }
      }
    }
  });
  if (well.rippleData && well.rippleData.texture) {
    well.rippleData.texture.dispose();
  }
}

function buildWellEntity(x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  const planeGeo = new THREE.PlaneGeometry(WELL_DIAMETER, WELL_DIAMETER);
  const wellMesh = new THREE.Mesh(planeGeo, wellMaterial);
  wellMesh.rotation.x = -Math.PI / 2;
  wellMesh.rotation.z = Math.PI;
  wellMesh.position.y = 0.025;
  group.add(wellMesh);

  const pitGeo = new THREE.CircleGeometry(INNER_WATER_RADIUS + 0.02, 24);
  const pitMat = new THREE.MeshBasicMaterial({ color: 0x011627 });
  const pitMesh = new THREE.Mesh(pitGeo, pitMat);
  pitMesh.rotation.x = -Math.PI / 2;
  pitMesh.position.set(0, 0.027, WATER_OFFSET_Z);
  group.add(pitMesh);

  const rippleData = createRippleTexture();
  const waterGeo = new THREE.CircleGeometry(INNER_WATER_RADIUS, 24);
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x0072ff,
    map: rippleData.texture,
    roughness: 0.15,
    metalness: 0.2,
    transparent: true,
    opacity: 0.96
  });
  const waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.rotation.x = -Math.PI / 2;
  waterMesh.position.set(0, WATER_Y, WATER_OFFSET_Z);
  group.add(waterMesh);

  const rimGeo = new THREE.RingGeometry(INNER_WATER_RADIUS - 0.06, INNER_WATER_RADIUS + 0.04, 24);
  const rimMat = new THREE.MeshBasicMaterial({ color: 0x000c18, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
  const rimMesh = new THREE.Mesh(rimGeo, rimMat);
  rimMesh.rotation.x = -Math.PI / 2;
  rimMesh.position.set(0, WATER_Y + 0.002, WATER_OFFSET_Z);
  group.add(rimMesh);

  const tinyFishes = [];
  const configs = [
    { p: 0x00cec9, f: 0x81ecec, dir: 1, radius: 0.26, spd: 0.9 },
    { p: 0xfdcb6e, f: 0xffeaa7, dir: -1, radius: 0.38, spd: 0.8 }
  ];

  for (let i = 0; i < 2; i++) {
    const cfg = configs[i];
    const tiny = createRealisticFish(cfg.p, cfg.f, 0.09);
    tiny.radius = cfg.radius;
    tiny.speed = cfg.spd;
    tiny.dir = cfg.dir;
    tiny.angle = Math.random() * Math.PI * 2;
    tiny.isJumping = false;
    tiny.jumpVel = 0;
    tiny.jumpY = 0;
    tiny.nextJumpTimer = 2.0 + Math.random() * 4.0;
    group.add(tiny.root);
    tinyFishes.push(tiny);
  }

  scene.add(group);

  return {
    group: group,
    water: waterMesh,
    waterBaseY: WATER_Y,
    waterOffsetZ: WATER_OFFSET_Z,
    rippleData: rippleData,
    waveIntensity: 0,
    tinyFishes: tinyFishes,
    x: x,
    z: z,
    radius: INNER_WATER_RADIUS
  };
}

function getDynamicDistance(currentScore) {
  const minDistance = 3.6;
  const maxDistance = 7.4;

  if (currentScore < 4) {
    return minDistance + (currentScore * 0.15);
  }

  const phase = (currentScore - 4) * 0.4;
  const cycle = (Math.sin(phase - Math.PI / 2) + 1) / 2;
  return minDistance + cycle * (maxDistance - minDistance);
}

function spawnNextTarget(fromWell) {
  const dynamicDist = getDynamicDistance(score);
  const forward = dynamicDist + (Math.random() * 0.4 - 0.2);
  const side = (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 1.0);
  return buildWellEntity(fromWell.x + side, fromWell.z + forward);
}

function initGameWells() {
  for (let i = 0; i < activeWells.length; i++) {
    disposeWellEntity(activeWells[i]);
  }
  activeWells = [];

  const startWell = buildWellEntity(0, 0);
  const targetWell = spawnNextTarget(startWell);
  activeWells.push(startWell, targetWell);
  resetFishToCurrentWell();
}

function resetFishToCurrentWell() {
  const well = activeWells[0];
  fishPos.set(well.x, well.waterBaseY + 0.05, well.z + well.waterOffsetZ);
  playerFish.root.position.copy(fishPos);
  const s = playerFish.baseScale;
  playerFish.root.scale.set(s, s, s);
  playerFish.root.rotation.set(0, 0, 0);
  fishVel.set(0, 0, 0);
  swimAngle = 0;
  gameState = 'READY';
}

function createRainSystem() {
  rainGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(rainCount * 3);
  const velocities = new Float32Array(rainCount);
  for (let i = 0; i < rainCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 50;
    positions[i * 3 + 1] = Math.random() * 25;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
    velocities[i] = 13.0 + Math.random() * 15.0;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  rainGeo.userData = { velocities: velocities };
  rainSystem = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x80deea, size: 0.12, transparent: true, opacity: 0.7 }));
  rainSystem.visible = false;
  scene.add(rainSystem);
}

function updateRain(delta) {
  if (!rainSystem || !rainSystem.visible) return;
  const positions = rainGeo.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
      if (positions[i * 3 + 1] < 0) {
      positions[i * 3 + 1] = 20 + Math.random() * 5;
      positions[i * 3] = fishPos.x + (Math.random() - 0.5) * 45;
      positions[i * 3 + 2] = fishPos.z + (Math.random() - 0.5) * 45;
    }
  }
  rainGeo.attributes.position.needsUpdate = true;
}

function updateWeather() {
  const weatherPhase = Math.floor(score / 35) % 4;
  if (weatherPhase === currentWeatherIndex) return;
  currentWeatherIndex = weatherPhase;

  if (weatherPhase === 0) {
    scene.background = new THREE.Color(0x2ed573);
    scene.fog.color = new THREE.Color(0x2ed573);
    ambientLight.color.setHex(0xffffff);
    ambientLight.intensity = 0.95;
    dirLight.color.setHex(0xfff3bf);
    if (rainSystem) rainSystem.visible = false;
  } else if (weatherPhase === 1) {
    scene.background = new THREE.Color(0xff7043);
    scene.fog.color = new THREE.Color(0xff7043);
    ambientLight.color.setHex(0xffab91);
    ambientLight.intensity = 0.7;
    dirLight.color.setHex(0xffd54f);
    if (rainSystem) rainSystem.visible = false;
  } else if (weatherPhase === 2) {
    scene.background = new THREE.Color(0x0a192f);
    scene.fog.color = new THREE.Color(0x0a192f);
    ambientLight.color.setHex(0x37474f);
    ambientLight.intensity = 0.35;
    dirLight.color.setHex(0x546e7a);
    if (rainSystem) rainSystem.visible = true;
  } else if (weatherPhase === 3) {
    scene.background = new THREE.Color(0x280659);
    scene.fog.color = new THREE.Color(0x280659);
    ambientLight.color.setHex(0xba68c8);
    ambientLight.intensity = 0.6;
    dirLight.color.setHex(0x00e5ff);
    if (rainSystem) rainSystem.visible = false;
  }
}

function spawnBubbles(delta) {
  if (Math.random() < 13.0 * delta) {
    const bubble = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })
    );
    bubble.position.set(fishPos.x + (Math.random() - 0.5) * 0.5, fishPos.y, fishPos.z + (Math.random() - 0.5) * 0.5);
    scene.add(bubble);
    bubbles.push({ mesh: bubble, speed: 0.9, life: 1.0 });
  }

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.mesh.position.y += b.speed * delta;
    b.life -= 0.9 * delta;
    b.mesh.material.opacity = Math.max(0, b.life * 0.7);
    if (b.life <= 0) {
      scene.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
      bubbles.splice(i, 1);
    }
  }
}

function createSplashEffect(pos, playAudio = true, isGroundHit = false) {
  if (playAudio && !isGroundHit) playWaterLandSound();
  const particleColor = isGroundHit ? 0x8b5a2b : 0x00e5ff;

  for (let i = 0; i < 18; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 5, 5),
      new THREE.MeshBasicMaterial({ color: particleColor })
    );
    p.position.set(pos.x, pos.y + 0.03, pos.z);
    const angle = Math.random() * Math.PI * 2;
    const spd = 2.7 + Math.random() * 4.2;
    scene.add(p);
    splashParticles.push({
      mesh: p,
      vel: new THREE.Vector3(Math.cos(angle) * spd, 4.8 + Math.random() * 5.4, Math.sin(angle) * spd),
      life: 1.0
    });
  }
}

function updateSplash(delta) {
  for (let i = splashParticles.length - 1; i >= 0; i--) {
    const sp = splashParticles[i];
    sp.mesh.position.addScaledVector(sp.vel, delta);
    sp.vel.y -= GRAVITY_SEC * 1.4 * delta;
    sp.life -= 2.1 * delta;
    sp.mesh.scale.setScalar(Math.max(0.01, sp.life));
    if (sp.life <= 0) {
      scene.remove(sp.mesh);
      sp.mesh.geometry.dispose();
      sp.mesh.material.dispose();
      splashParticles.splice(i, 1);
    }
  }
}

function updateLivesUI() {
  let fishIcons = '';
  for (let i = 0; i < 3; i++) {
    fishIcons += (i < lives) ? '🐟 ' : '🖤 ';
  }
  document.getElementById('lives').innerText = fishIcons.trim();
}

function startCharge() {
  if (gameState === 'READY') {
    gameState = 'CHARGING';
    chargePower = 0;
    document.getElementById('power-meter').style.display = 'block';
  }
}

function releaseJump() {
  if (gameState === 'CHARGING') {
    gameState = 'JUMPING';
    document.getElementById('power-meter').style.display = 'none';

    const currentWell = activeWells[0];
    const targetWell = activeWells[1];

    currentWell.waveIntensity = 1.0;

    const dx = targetWell.x - currentWell.x;
    const dz = (targetWell.z + targetWell.waterOffsetZ) - (currentWell.z + currentWell.waterOffsetZ);
    const targetDist = Math.hypot(dx, dz);

    const powerRatio = chargePower / maxPower;
    
    const flightDuration = 0.8 + powerRatio * 0.3;
    const horizontalDistance = 1.0 + powerRatio * (targetDist * 1.34);
    const horizontalSpeed = horizontalDistance / flightDuration;
    
    const initialVelocityY = (GRAVITY_SEC * flightDuration) * 0.5;

    fishVel.set(
      (dx / targetDist) * horizontalSpeed,
      initialVelocityY,
      (dz / targetDist) * horizontalSpeed
    );

    const angle = Math.atan2(dx, dz);
    playerFish.root.rotation.set(-0.25, angle, 0);
  }
}

function resetGame() {
  score = 0;
  lives = 3;
  currentWeatherIndex = -1;
  document.getElementById('score').innerText = score;
  updateLivesUI();
  document.getElementById('game-over').style.display = 'none';

  initGameWells();
  updateWeather();
}

function drawWaterRipples(well, time, isMoving) {
  const { ctx, texture } = well.rippleData;
  ctx.clearRect(0, 0, 128, 128);

  const grad = ctx.createRadialGradient(64, 64, 5, 64, 64, 62);
  grad.addColorStop(0, '#00a8ff');
  grad.addColorStop(0.5, '#0066ff');
  grad.addColorStop(0.85, '#003e99');
  grad.addColorStop(1, '#001a4d');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(64, 64, 63, 0, Math.PI * 2);
  ctx.fill();

  const numRings = 3;
  for (let i = 0; i < numRings; i++) {
    const ringProgress = ((time * 1.3 + i * (1 / numRings)) % 1);
    const radius = 12 + ringProgress * 38;
    const alpha = Math.sin(ringProgress * Math.PI) * (isMoving ? 0.35 : 0.15);

    ctx.strokeStyle = `rgba(220, 245, 255, ${alpha})`;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(64, 64, radius, 0, Math.PI * 2);
    ctx.stroke();
  }
  texture.needsUpdate = true;
}

function updateGameLogic(delta) {
  animClock += delta * 2.7;

  activeWells.forEach((w, idx) => {
    const isCurrentWell = (idx === 0);
    drawWaterRipples(w, animClock * 0.7, isCurrentWell && gameState === 'READY');

    w.tinyFishes.forEach(tiny => {
      tiny.angle += 0.72 * tiny.speed * tiny.dir * delta;
      tiny.root.position.x = Math.cos(tiny.angle) * tiny.radius;
      tiny.root.position.z = w.waterOffsetZ + Math.sin(tiny.angle) * tiny.radius;

      tiny.nextJumpTimer -= delta;
      if (tiny.nextJumpTimer <= 0 && !tiny.isJumping) {
        tiny.isJumping = true;
        tiny.jumpVel = 1.68 + Math.random() * 0.9;
        tiny.nextJumpTimer = 4.0 + Math.random() * 4.0;
        createSplashEffect(new THREE.Vector3(w.x + tiny.root.position.x, w.waterBaseY, w.z + tiny.root.position.z), false);
      }

      if (tiny.isJumping) {
        tiny.jumpY += tiny.jumpVel * delta;
        tiny.jumpVel -= 7.9 * delta;
        if (tiny.jumpY <= 0) {
          tiny.jumpY = 0;
          tiny.isJumping = false;
          createSplashEffect(new THREE.Vector3(w.x + tiny.root.position.x, w.waterBaseY, w.z + tiny.root.position.z), false);
        }
      }

      tiny.root.position.y = w.waterBaseY + 0.025 + tiny.jumpY;

      if (tiny.dir === 1) {
        tiny.root.rotation.y = -tiny.angle + Math.PI / 2;
      } else {
        tiny.root.rotation.y = -tiny.angle - Math.PI / 2;
      }

      if (tiny.isJumping) {
        tiny.root.rotation.x = -tiny.jumpVel * 0.2;
      } else {
        tiny.root.rotation.x = 0;
      }

      tiny.segments.forEach((bone, bIdx) => {
        bone.rotation.y = Math.sin(animClock * 4.2 * tiny.speed - (bIdx + 1) * 0.7) * 0.18;
      });
      tiny.tailMesh.rotation.y = Math.sin(animClock * 4.2 * tiny.speed - 3.2) * 0.22;
    });

    if (w.waveIntensity > 0) {
      w.waveIntensity -= 1.08 * delta;
      w.water.position.y = w.waterBaseY + Math.sin(animClock * 20) * 0.012 * Math.max(0, w.waveIntensity);
    } else {
      w.water.position.y = w.waterBaseY;
    }
  });

  const swimFreq = gameState === 'JUMPING' ? 5.5 : (gameState === 'CHARGING' ? 8.0 : 3.2);
  const waveAmp = gameState === 'CHARGING' ? 0.22 : 0.15;

  playerFish.segments.forEach((bone, index) => {
    bone.rotation.y = Math.sin(animClock * swimFreq - (index + 1) * 0.6) * waveAmp;
  });
  playerFish.tailMesh.rotation.y = Math.sin(animClock * swimFreq - 3.0) * (waveAmp * 1.3);

  const paddleWave = Math.sin(animClock * (swimFreq * 0.8));
  playerFish.leftPecPivot.rotation.y = -0.3 + paddleWave * 0.16;
  playerFish.rightPecPivot.rotation.y = 0.3 - paddleWave * 0.16;

  const curWell = activeWells[0];

  if (gameState === 'READY') {
    const s = playerFish.baseScale;
    playerFish.root.scale.set(s, s, s);
    if (curWell) {
      swimAngle += 1.08 * delta;
      fishPos.x = curWell.x + Math.cos(swimAngle) * 0.26;
      fishPos.z = curWell.z + curWell.waterOffsetZ + Math.sin(swimAngle) * 0.26;
      fishPos.y = curWell.waterBaseY + 0.03 + Math.sin(animClock * 2.0) * 0.008;
      playerFish.root.position.copy(fishPos);
      playerFish.root.rotation.y = -swimAngle + Math.PI / 2;
    }
  } else if (gameState === 'CHARGING') {
    chargePower = Math.min(chargePower + 84.0 * delta, maxPower);
    document.getElementById('power-fill').style.width = chargePower + '%';

    const s = playerFish.baseScale;
    const squash = 1 - (chargePower / maxPower) * 0.2;
    playerFish.root.scale.set(s * (1 + (chargePower / maxPower) * 0.1), s * squash, s);
    playerFish.root.position.y = curWell.waterBaseY + 0.03 - (1 - squash) * 0.05;
  } else if (gameState === 'JUMPING') {
    fishPos.addScaledVector(fishVel, delta);
    fishVel.y -= GRAVITY_SEC * delta;
    playerFish.root.position.copy(fishPos);

    const horizSpeed = Math.hypot(fishVel.x, fishVel.z);
    const heading = Math.atan2(fishVel.x, fishVel.z);
    const pitch = Math.atan2(fishVel.y, horizSpeed);
    playerFish.root.rotation.set(-pitch, heading, 0);

    const targetWell = activeWells[1];

    if (fishVel.y < 0 && fishPos.y <= WATER_Y + 0.02) {
      fishPos.y = WATER_Y + 0.03;
      const distToTarget = Math.hypot(fishPos.x - targetWell.x, fishPos.z - (targetWell.z + targetWell.waterOffsetZ));

      if (distToTarget <= INNER_WATER_RADIUS) {
        score++;
        document.getElementById('score').innerText = score;
        createSplashEffect(fishPos, true, false);

        updateWeather();

        disposeWellEntity(curWell);
        activeWells.shift();

        const nextTarget = spawnNextTarget(activeWells[0]);
        activeWells.push(nextTarget);

        resetFishToCurrentWell();
      } else {
        lives--;
        updateLivesUI();
        createSplashEffect(fishPos, false, true);

        if (lives > 0) {
          gameState = 'RESPAWNING';
          setTimeout(() => {
            resetFishToCurrentWell();
          }, 850);
        } else {
          gameState = 'GAMEOVER';
          document.getElementById('game-over').style.display = 'flex';
        }
      }
    }
  }

  if (curWell) {
    const targetCamX = curWell.x;
    const targetCamZ = curWell.z - 7.5;
    const targetCamY = 11.5;

    const smoothFactor = 1 - Math.exp(-4.2 * delta);
    camera.position.x += (targetCamX - camera.position.x) * smoothFactor;
    camera.position.z += (targetCamZ - camera.position.z) * smoothFactor;
    camera.position.y += (targetCamY - camera.position.y) * smoothFactor;
    const lookTarget = activeWells[1] ? activeWells[1] : curWell;
    camera.lookAt((curWell.x + lookTarget.x) / 2, 0, (curWell.z + lookTarget.z) / 2);
  }

  spawnBubbles(delta);
  updateSplash(delta);
  updateRain(delta);
}

const gameClock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(gameClock.getDelta(), 0.1);
  updateGameLogic(delta);
  renderer.render(scene, camera);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

window.onload = init;

<script>
const splashAudio = new Audio('https://files.catbox.moe/eizhrs.mp3');
const bgMusic = new Audio('https://files.catbox.moe/r1txg9.mp3');
bgMusic.loop = true;
bgMusic.volume = 1.0;
let isMusicMuted = false;
let gameStarted = false;
function playWaterLandSound() {
splashAudio.currentTime = 0;
splashAudio.play().catch(e => console.log("Audio play blocked: ", e));
}
function initStartScreen() {
const startScreen = document.getElementById('start-screen');
const startGame = () => {
if (!gameStarted) {
gameStarted = true;
startScreen.style.display = 'none';
if (!isMusicMuted && bgMusic.paused) {
bgMusic.play().catch(e => console.log("Bg audio play blocked: ", e));
}
}
};
startScreen.addEventListener('click', startGame);
startScreen.addEventListener('touchstart', startGame);
    }function initMusicControls() {
const musicBtn = document.getElementById('music-btn');
musicBtn.addEventListener('click', (e) => {
e.stopPropagation();
if (isMusicMuted) {
bgMusic.play();
musicBtn.innerText = '🔊';
isMusicMuted = false;
} else {
bgMusic.pause();
musicBtn.innerText = '🔇';
isMusicMuted = true;
}
});
}
let scene, camera, renderer;
let ambientLight, dirLight;
let fishGroup, tailMesh, waterPits = [], currentPitIndex = 0;
let tiny3DFishes = [];
let bubbles = [];
let splashParticles = [];

let chargePower = 0;
const maxPower = 100;
let score = 0;
let lives = 3;
let animClock = 0;
let fishPos = new THREE.Vector3();
let fishVel = new THREE.Vector3();
const gravity = -0.0065;
let cameraTarget = new THREE.Vector3();
let fishCircleAngle = 0;
let fishSwimRadius = 0.5;
const oceanDepthY = -45;

let oceanExitPit, exitBeaconLight, exitBeaconBeam;

let rainSystem, rainGeo, rainCount = 1500;

function init() {
const container = document.getElementById('canvas-container');
scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);
const aspect = window.innerWidth / window.innerHeight;
const d = 7.5;
camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
camera.position.set(-9, 11, -9);
camera.lookAt(0, 0, 0);
renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambientLight);
dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
dirLight.position.set(-10, 30, -10);
dirLight.castShadow = true;
scene.add(dirLight);
createGrassField();
create3DTinyTrees();
create3DFish();
createRainSystem();
createDeepOceanWorld();
spawnPit(new THREE.Vector3(0, 0, 0), 1.85);
spawnNextPit();
initStartScreen();
initMusicControls();
initSteeringControls();
window.addEventListener('resize', onWindowResize);
const handleSurfaceDown = (e) => {
if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn') || e.target.closest('#steering-container')) return;
if (gameState === 'READY') startCharge();
};
const handleSurfaceUp = (e) => {
if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn') || e.target.closest('#steering-container')) return;
if (gameState === 'CHARGING') releaseJump();
};
window.addEventListener('mousedown', handleSurfaceDown);
window.addEventListener('mouseup', handleSurfaceUp);
window.addEventListener('touchstart', (e) => {
if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn') || e.target.closest('#steering-container')) return;
if (gameState === 'READY') { e.preventDefault(); startCharge(); }
}, { passive: false });
window.addEventListener('touchend', (e) => {
if (!gameStarted || e.target.closest('#music-btn') || e.target.closest('#restart-btn') || e.target.closest('#steering-container')) return;
if (gameState === 'CHARGING') releaseJump();
});document.getElementById('restart-btn').addEventListener('click', (e) => {
e.stopPropagation();
resetGame();
});
resetGame();
animate();
}
function initSteeringControls() {
const steeringContainer = document.getElementById('steering-container');
const steeringWheel = document.getElementById('steering-wheel');
const computeWheelAngle = (clientX, clientY) => {
const rect = steeringWheel.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
const dx = clientX - centerX;
const dy = clientY - centerY;
return Math.atan2(dy, dx) + Math.PI / 2;
};
const onWheelStart = (e) => {
e.stopPropagation();
if (gameState !== 'UNDERWATER') return;
isSteering = true;
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
wheelAngle = computeWheelAngle(clientX, clientY);
steeringWheel.style.transform = rotate(${wheelAngle * (180 / Math.PI)}deg);
};
const onWheelMove = (e) => {
if (!isSteering || gameState !== 'UNDERWATER') return;
e.preventDefault();
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
wheelAngle = computeWheelAngle(clientX, clientY);
steeringWheel.style.transform = rotate(${wheelAngle * (180 / Math.PI)}deg);
fishHeadingAngle = -wheelAngle + Math.PI / 4;
};
const onWheelEnd = (e) => {
if (isSteering) {
isSteering = false;
}
};
steeringContainer.addEventListener('mousedown', onWheelStart);
window.addEventListener('mousemove', onWheelMove);
window.addEventListener('mouseup', onWheelEnd);
steeringContainer.addEventListener('touchstart', onWheelStart, { passive: false });
window.addEventListener('touchmove', onWheelMove, { passive: false });
window.addEventListener('touchend', onWheelEnd);
}
function onWindowResize() {
const aspect = window.innerWidth / window.innerHeight;
const d = 7.5;
camera.left = -d * aspect;
camera.right = d * aspect;
camera.top = d;
camera.bottom = -d;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
function createGrassField() {
const groundGeo = new THREE.PlaneGeometry(600, 600);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);
const bladeGeo = new THREE.ConeGeometry(0.12, 0.5, 4);
const bladeMat = new THREE.MeshStandardMaterial({ color: 0x76ff03, roughness: 0.6 });
for (let i = 0; i < 400; i++) {
const cluster = new THREE.Group();
const count = 3 + Math.floor(Math.random() * 3);
for (let j = 0; j < count; j++) {
const blade = new THREE.Mesh(bladeGeo, bladeMat);
blade.position.set((Math.random() - 0.5) * 0.3, 0.25, (Math.random() - 0.5) * 0.3);
blade.rotation.y = Math.random() * Math.PI;
blade.rotation.z = (Math.random() - 0.5) * 0.4;
blade.castShadow = true;
cluster.add(blade);
}
const x = (Math.random() - 0.5) * 250;
const z = (Math.random() - 0.5) * 250;
cluster.position.set(x, 0, z);
scene.add(cluster);
}
}
function create3DTinyTrees() {
const trunkGeo = new THREE.CylinderGeometry(0.1, 0.15, 0.6, 8);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.9 });
const leavesGeo = new THREE.ConeGeometry(0.5, 1.1, 8);
const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.6 });
for (let i = 0; i < 70; i++) {
const x = (Math.random() - 0.5) * 250;
const z = (Math.random() - 0.5) * 250;
if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
const tree = new THREE.Group();
const trunk = new THREE.Mesh(trunkGeo, trunkMat);
trunk.position.y = 0.3;
trunk.castShadow = true;
tree.add(trunk);
const leaves = new THREE.Mesh(leavesGeo, leavesMat);
leaves.position.y = 0.95;
leaves.castShadow = true;
tree.add(leaves);
const scale = 0.8 + Math.random() * 0.5;
tree.scale.set(scale, scale, scale);
tree.position.set(x, 0, z);
scene.add(tree);
}
}

(Math.random() - 0.5) * 16
);
spr.position.copy(center).add(offset);
oceanGroup.add(spr);
schoolMembers.push({ sprite: spr, offset: offset });
}
emojiSchools.push({
members: schoolMembers,
center: center,
speedX: (0.04 + Math.random() * 0.03) * (Math.random() > 0.5 ? 1 : -1),
speedZ: (0.02 + Math.random() * 0.02) * (Math.random() > 0.5 ? 1 : -1)
});
}
});
const giantTex = createEmojiTexture('🐠');
const giantMat = new THREE.SpriteMaterial({ map: giantTex, transparent: true });
for (let i = 0; i < 3; i++) {
const gSpr = new THREE.Sprite(giantMat);
gSpr.scale.set(5.5, 5.5, 5.5);
const gx = -25 + i * 25;
const gy = 1 + (i % 2) * 2;
const gz = -15 + i * 15;
gSpr.position.set(gx, gy, gz);
oceanGroup.add(gSpr);
giantFishes.push({
sprite: gSpr,
baseX: gx,
baseY: gy,
baseZ: gz,
speed: 0.025 + i * 0.01
});
}
const groundEmojis = ['🐊', '🐢', '🐊', '🐢'];
groundEmojis.forEach((em, idx) => {
const gTex = createEmojiTexture(em);
const gMat = new THREE.SpriteMaterial({ map: gTex, transparent: true });
const walkerSpr = new THREE.Sprite(gMat);
walkerSpr.scale.set(2.4, 2.4, 2.4);
const wx = (Math.random() - 0.5) * 70;
const wz = (Math.random() - 0.5) * 70;
walkerSpr.position.set(wx, -3.2, wz);
oceanGroup.add(walkerSpr);
groundWalkers.push({
sprite: walkerSpr,
speedX: (0.01 + Math.random() * 0.01) * (idx % 2 === 0 ? 1 : -1),
speedZ: (0.008 + Math.random() * 0.008) * (idx > 1 ? 1 : -1)
});
});
oceanExitPit = new THREE.Group();
const portalBaseGeo = new THREE.CylinderGeometry(2.4, 2.8, 0.5, 32);
const portalBaseMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, emissive: 0x004d40 });
const portalBase = new THREE.Mesh(portalBaseGeo, portalBaseMat);
portalBase.position.y = -3.8;
oceanExitPit.add(portalBase);
const portalWaterGeo = new THREE.CircleGeometry(2.3, 32);
const portalWaterMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
const portalWater = new THREE.Mesh(portalWaterGeo, portalWaterMat);
portalWater.rotation.x = -Math.PI / 2;
portalWater.position.y = -3.52;
oceanExitPit.add(portalWater);
const beamGeo = new THREE.CylinderGeometry(0.35, 1.2, 28, 16);
const beamMat = new THREE.MeshBasicMaterial({
color: 0x00ffcc,
transparent: true,
opacity: 0.45
});
exitBeaconBeam = new THREE.Mesh(beamGeo, beamMat);
exitBeaconBeam.position.y = 10;
oceanExitPit.add(exitBeaconBeam);
exitBeaconLight = new THREE.PointLight(0x00ffcc, 3, 25);
exitBeaconLight.position.set(0, 1, 0);
oceanExitPit.add(exitBeaconLight);
oceanExitPit.position.set(30, 0, 15);
oceanGroup.add(oceanExitPit);
scene.add(oceanGroup);
}
function spawnPit(position, radius) {
const pitGroup = new THREE.Group();
pitGroup.position.copy(position);
const isOceanPit = ((waterPits.length + 1) % 25 === 0);
const moundGeo = new THREE.CylinderGeometry(radius, radius + 0.2, 0.18, 32);
const moundMat = new THREE.MeshStandardMaterial({
color: isOceanPit ? 0x01579b : 0x5d4037,
roughness: 0.8
});
const mound = new THREE.Mesh(moundGeo, moundMat);
mound.position.y = 0.05;
mound.receiveShadow = true;
mound.castShadow = true;
pitGroup.add(mound);
const waterGeo = new THREE.CylinderGeometry(radius - 0.1, radius - 0.1, 0.12, 32);
const waterMat = new THREE.MeshStandardMaterial({
color: 0x00e5ff,
roughness: 0.05,
metalness: 0.1,
transparent: true,
opacity: 0.9
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = 0.09;
pitGroup.add(water);
const innerGeo = new THREE.CircleGeometry(radius - 0.25, 32);
const innerMat = new THREE.MeshBasicMaterial({ color: isOceanPit ? 0x001064 : 0x0091ea });
const inner = new THREE.Mesh(innerGeo, innerMat);
inner.rotation.x = -Math.PI / 2;
inner.position.y = 0.151;
pitGroup.add(inner);
pitGroup.userData = {
waterMesh: water,
radius: radius - 0.1,
isOceanEntrance: isOceanPit,
pitNumber: waterPits.length + 1
};scene.add(pitGroup);
waterPits.push(pitGroup);
const fishColors = [0xff3d00, 0xffd600, 0x00e676, 0xff007f];
for (let i = 0; i < 3; i++) {
const color = fishColors[i % fishColors.length];
const tinyFish = createTiny3DFishMesh(color);
const r = 0.2 + Math.random() * (radius - 0.5);
const angle = Math.random() * Math.PI * 2;
tinyFish.position.set(
position.x + Math.cos(angle) * r,
0.12,
position.z + Math.sin(angle) * r
);
scene.add(tinyFish);
tiny3DFishes.push({
mesh: tinyFish,
center: position.clone(),
radius: r,
angle: angle,
speed: (0.012 + Math.random() * 0.015) * (Math.random() > 0.5 ? 1 : -1)
});
}
}
function spawnNextPit() {
const lastPit = waterPits[waterPits.length - 1];
const wave = (Math.sin(score * 0.5) + 1) / 2;
const currentRadius = 1.85 - (wave * 0.7);
const minDistance = 2.8 + (wave * 2.8);
const distance = minDistance + Math.random() * 0.4;
const isXDir = Math.random() > 0.5;
const newPos = lastPit.position.clone();
if (isXDir) newPos.x += distance;
else newPos.z += distance;
spawnPit(newPos, currentRadius);
}
function createRainSystem() {
rainGeo = new THREE.BufferGeometry();
const positions = new Float32Array(rainCount * 3);
const velocities = new Float32Array(rainCount);
for (let i = 0; i < rainCount; i++) {
positions[i * 3] = (Math.random() - 0.5) * 50;
positions[i * 3 + 1] = Math.random() * 25;
positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
velocities[i] = 0.2 + Math.random() * 0.25;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
rainGeo.userData = { velocities: velocities };
const rainMat = new THREE.PointsMaterial({
color: 0x80deea,
size: 0.12,
transparent: true,
opacity: 0.7
});
rainSystem = new THREE.Points(rainGeo, rainMat);
rainSystem.visible = false;
scene.add(rainSystem);
}
function updateRain() {
if (!rainSystem || !rainSystem.visible) return;
const positions = rainGeo.attributes.position.array;
const velocities = rainGeo.userData.velocities;
for (let i = 0; i < rainCount; i++) {
positions[i * 3 + 1] -= velocities[i];
positions[i * 3] += 0.02;
if (positions[i * 3 + 1] < 0) {
positions[i * 3 + 1] = 20 + Math.random() * 5;
positions[i * 3] = fishPos.x + (Math.random() - 0.5) * 45;
positions[i * 3 + 2] = fishPos.z + (Math.random() - 0.5) * 45;
}
}
rainGeo.attributes.position.needsUpdate = true;
}
function updateWeather() {
if (gameState === 'UNDERWATER') return;
const weatherPhase = Math.floor(score / 50) % 4;
if (weatherPhase === currentWeatherIndex) return;
currentWeatherIndex = weatherPhase;
if (weatherPhase === 0) {
scene.background = new THREE.Color(0x87ceeb);
scene.fog.color = new THREE.Color(0x87ceeb);
ambientLight.color.setHex(0xffffff);
ambientLight.intensity = 0.9;
dirLight.color.setHex(0xfffaed);
dirLight.intensity = 0.9;
if (rainSystem) rainSystem.visible = false;
} else if (weatherPhase === 1) {
scene.background = new THREE.Color(0xff7043);
scene.fog.color = new THREE.Color(0xff7043);
ambientLight.color.setHex(0xffab91);
ambientLight.intensity = 0.7;
dirLight.color.setHex(0xffd54f);
dirLight.intensity = 0.8;
if (rainSystem) rainSystem.visible = false;
} else if (weatherPhase === 2) {
scene.background = new THREE.Color(0x0a192f);
scene.fog.color = new THREE.Color(0x0a192f);
ambientLight.color.setHex(0x37474f);
ambientLight.intensity = 0.35;
dirLight.color.setHex(0x546e7a);
dirLight.intensity = 0.4;
if (rainSystem) rainSystem.visible = true;
} else if (weatherPhase === 3) {
scene.background = new THREE.Color(0x280659);
scene.fog.color = new THREE.Color(0x280659);
ambientLight.color.setHex(0xba68c8);
ambientLight.intensity = 0.6;
dirLight.color.setHex(0x00e5ff);
dirLight.intensity = 0.6;
if (rainSystem) rainSystem.visible = false;
}
}
function spawnBubbles() {
const isUnder = (gameState === 'UNDERWATER');
const bubbleRate = isUnder ? 0.75 : 0.25;
if (Math.random() < bubbleRate) {
const bubbleGeo = new THREE.SphereGeometry(isUnder ? (0.05 + Math.random() * 0.08) : (0.04 + Math.random() * 0.04), 8, 8);
const bubbleMat = new THREE.MeshBasicMaterial({
color: isUnder ? 0x80deea : 0xffffff,
transparent: true,
opacity: 0.7
});
const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
const spawnX = isUnder ? (fishPos.x + (Math.random() - 0.5) * 16) : (fishPos.x + (Math.random() - 0.5) * 0.5);
const spawnY = isUnder ? (oceanDepthY - 3.5) : fishPos.y;
const spawnZ = isUnder ? (fishPos.z + (Math.random() - 0.5) * 16) : (fishPos.z + (Math.random() - 0.5) * 0.5);
bubble.position.set(spawnX, spawnY, spawnZ);
scene.add(bubble);
bubbles.push({
mesh: bubble,
speed: isUnder ? (0.03 + Math.random() * 0.04) : (0.012 + Math.random() * 0.02),
life: 1.0,
isUnder: isUnder
});
    }for (let i = bubbles.length - 1; i >= 0; i--) {
const b = bubbles[i];
b.mesh.position.y += b.speed;
b.life -= b.isUnder ? 0.006 : 0.015;
b.mesh.material.opacity = b.life * 0.7;
if (b.life <= 0 || (b.isUnder && b.mesh.position.y > oceanDepthY + 8)) {
scene.remove(b.mesh);
bubbles.splice(i, 1);
}
}
}
function createSplashEffect(pos) {
playWaterLandSound();
for (let i = 0; i < 25; i++) {
const splashGeo = new THREE.SphereGeometry(0.05 + Math.random() * 0.06, 8, 8);
const splashMat = new THREE.MeshBasicMaterial({ color: 0x80deea, transparent: true, opacity: 0.9 });
const p = new THREE.Mesh(splashGeo, splashMat);
p.position.copy(pos);
p.position.y = 0.15;
const angle = Math.random() * Math.PI * 2;
const speed = 0.04 + Math.random() * 0.06;
scene.add(p);
splashParticles.push({
mesh: p,
vel: new THREE.Vector3(Math.cos(angle) * speed, 0.08 + Math.random() * 0.08, Math.sin(angle) * speed),
life: 1.0
});
}
}
function updateSplash() {
for (let i = splashParticles.length - 1; i >= 0; i--) {
const p = splashParticles[i];
p.mesh.position.add(p.vel);
p.vel.y += gravity * 0.5;
p.life -= 0.03;
p.mesh.material.opacity = Math.max(0, p.life);
if (p.life <= 0) {
scene.remove(p.mesh);
splashParticles.splice(i, 1);
}
}
}
function updateLivesUI() {
let hearts = '';
for (let i = 0; i < 3; i++) {
hearts += (i < lives) ? '❤️' : '🖤';
}
document.getElementById('lives').innerText = hearts;
}
function startCharge() {
if (gameState === 'READY') {
gameState = 'CHARGING';
chargePower = 0;
document.getElementById('power-meter').style.display = 'block';
}
}
function releaseJump() {
if (gameState === 'CHARGING') {
gameState = 'JUMPING';
document.getElementById('power-meter').style.display = 'none';
const nextPit = waterPits[currentPitIndex + 1];
const startPos = fishPos.clone();
const dir = new THREE.Vector3().subVectors(nextPit.position, startPos).normalize();
const jumpDistance = (chargePower / maxPower) * 7.5;
const totalVel = Math.sqrt(jumpDistance * -gravity);
fishVel.copy(dir).multiplyScalar(totalVel);
fishVel.y = totalVel * 1.15;
}
}
function enterOceanWorld() {
gameState = 'UNDERWATER';
document.getElementById('instruction').innerText = '🌊 Steering Wheel ghuma kar fish ko disha dein!';
document.getElementById('compass').style.display = 'block';
document.getElementById('steering-container').style.display = 'block';
const entryPit = waterPits[currentPitIndex];
oceanGroup.position.set(entryPit.position.x - 10, oceanDepthY, entryPit.position.z);
scene.background = new THREE.Color(0x001e3d);
scene.fog.color = new THREE.Color(0x001e3d);
scene.fog.density = 0.015;
ambientLight.color.setHex(0x00e5ff);
ambientLight.intensity = 0.6;
dirLight.color.setHex(0x80d8ff);
dirLight.intensity = 0.7;
if (rainSystem) rainSystem.visible = false;
fishPos.set(oceanGroup.position.x - 12, oceanDepthY - 1, oceanGroup.position.z);
fishGroup.position.copy(fishPos);
fishGroup.rotation.set(0, 0, 0);
fishHeadingAngle = 0;
wheelAngle = 0;
document.getElementById('steering-wheel').style.transform = 'rotate(0deg)';
oceanExitPosWorld.set(
oceanGroup.position.x + oceanExitPit.position.x,
oceanDepthY - 2.5,
oceanGroup.position.z + oceanExitPit.position.z
);
}
function exitOceanWorld() {
document.getElementById('compass').style.display = 'none';
document.getElementById('steering-container').style.display = 'none';
isSteering = false;
spawnNextPit();
currentPitIndex++;
score++;
document.getElementById('score').innerText = score;
const nextSurfacePit = waterPits[currentPitIndex];
fishPos.copy(nextSurfacePit.position);
fishPos.y = 0.12;
fishGroup.position.copy(fishPos);
fishGroup.rotation.set(0, 0, 0);
createSplashEffect(fishPos);
currentWeatherIndex = -1;
scene.fog.density = 0.012;
updateWeather();
spawnNextPit();
gameState = 'READY';
document.getElementById('instruction').innerText = 'Hold karke power bharein aur jump karein!';
cameraTarget.copy(nextSurfacePit.position);
}
function respawnInCurrentPit() {
const currentPit = waterPits[currentPitIndex];
fishPos.copy(currentPit.position);
fishPos.y = 0.12;
fishGroup.position.copy(fishPos);
fishGroup.rotation.set(0, 0, 0);
fishCircleAngle = 0;
gameState = 'READY';
}
function resetGame() {
score = 0;
lives = 3;
currentWeatherIndex = -1;
document.getElementById('score').innerText = score;
document.getElementById('instruction').innerText = 'Hold karke power bharein aur jump karein!';
document.getElementById('compass').style.display = 'none';
document.getElementById('steering-container').style.display = 'none';
isSteering = false;
updateLivesUI();
document.getElementById('game-over').style.display = 'none';
waterPits.forEach(p => scene.remove(p));
waterPits = [];
tiny3DFishes.forEach(f => scene.remove(f.mesh));
tiny3DFishes = [];
currentPitIndex = 0;
spawnPit(new THREE.Vector3(0, 0, 0), 1.85);
spawnNextPit();
respawnInCurrentPit();
cameraTarget.set(0, 0, 0);
updateWeather();
}
function updateGameLogic() {
animClock += 0.05;
if (exitBeaconBeam && exitBeaconLight) {
const pulse = 0.35 + Math.sin(animClock * 3) * 0.15;
exitBeaconBeam.material.opacity = pulse;
exitBeaconLight.intensity = 2.5 + Math.sin(animClock * 4) * 1.5;
}
if (whaleMesh) {
whaleMesh.position.x -= 0.045;
whaleMesh.position.y += Math.sin(animClock * 1.5) * 0.015;
whaleTail.rotation.y = Math.sin(animClock * 2.5) * 0.3;
if (whaleMesh.position.x < oceanGroup.position.x - 45) {
whaleMesh.position.x = oceanGroup.position.x + 45;
}
}
const schoolCenter = new THREE.Vector3(
oceanGroup.position.x + Math.sin(animClock * 0.5) * 15,
oceanDepthY + Math.cos(animClock * 0.7) * 2,
oceanGroup.position.z + Math.cos(animClock * 0.5) * 8
);
fishSchool.forEach((sf) => {
sf.mesh.position.copy(schoolCenter).add(sf.offset);
sf.mesh.rotation.y = -animClock * 0.5 - Math.PI / 2;
});
emojiSchools.forEach((esc) => {
esc.center.x += esc.speedX;
esc.center.z += esc.speedZ;
if (esc.center.x > 50) esc.speedX = -Math.abs(esc.speedX);
if (esc.center.x < -50) esc.speedX = Math.abs(esc.speedX);
if (esc.center.z > 50) esc.speedZ = -Math.abs(esc.speedZ);
if (esc.center.z < -50) esc.speedZ = Math.abs(esc.speedZ);esc.members.forEach((m) => {
m.sprite.position.x = esc.center.x + m.offset.x;
m.sprite.position.y = esc.center.y + m.offset.y + Math.sin(animClock * 3 + m.offset.x) * 0.2;
m.sprite.position.z = esc.center.z + m.offset.z;
});
});
giantFishes.forEach((gf, i) => {
gf.sprite.position.x = gf.baseX + Math.sin(animClock * gf.speed * 20 + i) * 8;
gf.sprite.position.z = gf.baseZ + Math.cos(animClock * gf.speed * 20 + i) * 6;
gf.sprite.position.y = gf.baseY + Math.sin(animClock * 2 + i) * 0.4;
});
groundWalkers.forEach((gw) => {
gw.sprite.position.x += gw.speedX;
gw.sprite.position.z += gw.speedZ;
if (gw.sprite.position.x > 45) gw.speedX = -Math.abs(gw.speedX);
if (gw.sprite.position.x < -45) gw.speedX = Math.abs(gw.speedX);
if (gw.sprite.position.z > 45) gw.speedZ = -Math.abs(gw.speedZ);
if (gw.sprite.position.z < -45) gw.speedZ = Math.abs(gw.speedZ);
});
const currentPit = waterPits[currentPitIndex];
if (gameState === 'READY') {
fishGroup.scale.set(1, 1, 1);
if (currentPit) {
const rad = Math.min(fishSwimRadius, currentPit.userData.radius * 0.5);
fishCircleAngle += 0.035;
fishPos.x = currentPit.position.x + Math.cos(fishCircleAngle) * rad;
fishPos.z = currentPit.position.z + Math.sin(fishCircleAngle) * rad;
fishPos.y = 0.12 + Math.sin(animClock * 2) * 0.02;
fishGroup.position.copy(fishPos);
fishGroup.rotation.set(0, -fishCircleAngle - Math.PI / 2, 0);
}
tailMesh.rotation.y = Math.sin(animClock * 4) * 0.4;
} else if (gameState === 'CHARGING') {
chargePower = Math.min(chargePower + 2.2, maxPower);
document.getElementById('power-fill').style.width = chargePower + '%';
const targetPit = waterPits[currentPitIndex + 1];
if (targetPit) {
const lookDir = new THREE.Vector3().subVectors(targetPit.position, fishPos);
fishGroup.rotation.set(0, Math.atan2(-lookDir.z, lookDir.x), 0);
}
const squeeze = 1 - (chargePower / maxPower) * 0.25;
fishGroup.scale.set(squeeze, squeeze, squeeze * 1.1);
tailMesh.rotation.y = Math.sin(animClock * 8) * 0.5;
} else if (gameState === 'JUMPING') {
fishPos.add(fishVel);
fishVel.y += gravity;
fishGroup.position.copy(fishPos);
const moveAngle = Math.atan2(-fishVel.z, fishVel.x);
const verticalAngle = Math.atan2(fishVel.y, Math.sqrt(fishVel.x * fishVel.x + fishVel.z * fishVel.z));
fishGroup.rotation.set(0, moveAngle, verticalAngle);
tailMesh.rotation.y = Math.sin(animClock * 6) * 0.6;
if (fishPos.y <= 0.12) {
fishPos.y = 0.12;
const targetPit = waterPits[currentPitIndex + 1];
const dist = fishPos.distanceTo(targetPit.position);
if (dist <= targetPit.userData.radius) {
currentPitIndex++;
score++;
document.getElementById('score').innerText = score;
createSplashEffect(fishPos);
if (currentPitIndex % 25 === 0) {
enterOceanWorld();
return;
}
updateWeather();
spawnNextPit();
fishGroup.rotation.set(0, 0, 0);
gameState = 'READY';
cameraTarget.copy(targetPit.position);
} else {
lives--;
updateLivesUI();
fishGroup.rotation.set(0, fishGroup.rotation.y, Math.PI / 2);
if (lives > 0) {
gameState = 'RESPAWNING';
setTimeout(() => {
respawnInCurrentPit();
}, 1000);
} else {
gameState = 'GAMEOVER';
document.getElementById('game-over').style.display = 'flex';
}
}
}
} else if (gameState === 'UNDERWATER') {
const swimSpeed = isSteering ? 0.18 : 0.08;
fishPos.x += Math.cos(fishHeadingAngle) * swimSpeed;
fishPos.z += -Math.sin(fishHeadingAngle) * swimSpeed;
fishPos.y = oceanDepthY - 1.2 + Math.sin(animClock * 2.5) * 0.18;
fishGroup.position.copy(fishPos);
fishGroup.rotation.set(0, fishHeadingAngle, Math.sin(animClock * 4) * 0.1);
tailMesh.rotation.y = Math.sin(animClock * (isSteering ? 12 : 5)) * 0.6;
cameraTarget.copy(fishPos);
const diffX = oceanExitPosWorld.x - fishPos.x;
const diffZ = oceanExitPosWorld.z - fishPos.z;
const distToOceanPit = Math.hypot(diffX, diffZ);
let dirArrow = '➜';
if (Math.abs(diffX) > Math.abs(diffZ)) {
dirArrow = diffX > 0 ? 'East ➜' : 'West ⬅';
} else {
dirArrow = diffZ > 0 ? 'South ⬇' : 'North ⬆';
}
document.getElementById('compass').innerText = 🧭 Portal: ${Math.round(distToOceanPit)}m (${dirArrow});
if (distToOceanPit < 2.6) {
exitOceanWorld();
}
}
camera.position.x += (cameraTarget.x - 9 - camera.position.x) * 0.05;
camera.position.y += (cameraTarget.y + 11 - camera.position.y) * 0.05;
camera.position.z += (cameraTarget.z - 9 - camera.position.z) * 0.05;
camera.lookAt(cameraTarget.x, cameraTarget.y, cameraTarget.z);
tiny3DFishes.forEach(tf => {
tf.angle += tf.speed;
tf.mesh.position.x = tf.center.x + Math.cos(tf.angle) * tf.radius;
tf.mesh.position.z = tf.center.z + Math.sin(tf.angle) * tf.radius;
tf.mesh.rotation.y = -tf.angle - (tf.speed > 0 ? Math.PI / 2 : -Math.PI / 2);
});
spawnBubbles();
updateSplash();
updateRain();
}
function animate() {
requestAnimationFrame(animate);
updateGameLogic();
renderer.render(scene, camera);
}
window.onload = init;
</script>
